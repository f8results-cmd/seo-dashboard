[build]
builder = "nixpacks"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

[[cron]]
name = "friday-update-reminder"
# Every Friday at 9:00 AM AEST (= 23:00 UTC Thursday, since AEST = UTC+10)
schedule = "0 23 * * 4"
command = "curl -sf \"$RAILWAY_PUBLIC_DOMAIN/api/reminders/friday-update?secret=$CRON_SECRET\" || true"